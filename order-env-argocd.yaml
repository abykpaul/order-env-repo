apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-env-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/abykpaul/order-env-repo.git
    targetRevision: main
    path: helm/microservices

  destination:
    server: https://kubernetes.default.svc
    namespace: order-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true